<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><style>.k{transform-box:view-box;transform-origin:50px 92px;animation:a 2.4s ease-in-out infinite alternate}@keyframes a{to{transform:scale(1.02,.985)}}.schein{animation:sch 1.8s ease-in-out infinite alternate}@keyframes sch{from{opacity:.15}to{opacity:.45}}.schwing{animation:sw 1.8s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}.dreh{animation:dr 2s ease-in-out infinite alternate}@keyframes dr{from{transform:scaleX(1)}to{transform:scaleX(-1)}}.flamme{animation:fl .5s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.9,1.1) rotate(3deg)}}.funkel{animation:fu 1.4s ease-in-out infinite alternate}@keyframes fu{from{opacity:.4}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="50" cy="94" rx="34" ry="3.6" fill="#3a2414" opacity=".13"/><g class="k"><path d="M58 14 a32 32 0 1 0 28 44 a26 26 0 1 1 -28 -44 Z" fill="#ffe27a"/>
