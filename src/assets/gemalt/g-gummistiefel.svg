<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><style>.k{transform-box:view-box;transform-origin:50px 92px;animation:w 2.6s ease-in-out infinite alternate}@keyframes w{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}.schein{animation:sch 1.8s ease-in-out infinite alternate}@keyframes sch{from{opacity:.15}to{opacity:.45}}.schwing{animation:sw 1.8s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}.dreh{animation:dr 2s ease-in-out infinite alternate}@keyframes dr{from{transform:scaleX(1)}to{transform:scaleX(-1)}}.flamme{animation:fl .5s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.9,1.1) rotate(3deg)}}.funkel{animation:fu 1.4s ease-in-out infinite alternate}@keyframes fu{from{opacity:.4}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse cx="50" cy="94" rx="34" ry="3.6" fill="#3a2414" opacity=".13"/><g class="k"><g transform="translate(-2 0)"><path d="M18 20 L40 20 L40 66 C52 68 58 76 56 86 L14 86 C12 80 16 74 18 70 Z" fill="#ffd23a"/><path d="M32 20 L40 20 L40 66 C52 68 58 76 56 86 L40 86 C48 78 44 70 32 68 Z" fill="#e8b020"/><rect x="16" y="16" width="26" height="8" rx="3" fill="#f2c21a"/><path d="M14 86 L56 86 L56 90 L14 90 Z" fill="#7a5a2a"/><ellipse cx="24" cy="40" rx="3" ry="10" fill="#fff" opacity=".4"/></g>
